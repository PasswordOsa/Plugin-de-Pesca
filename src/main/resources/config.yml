# ===================== PescaPlus =====================
autoguardado-minutos: 5

nivel:
  maximo: 50
  xp-base: 100            # XP para pasar del nivel L al siguiente = xp-base * L^exponente
  exponente: 1.5
  bonus-venta-por-nivel: 0.01     # +1% al precio de venta por nivel
  bonus-rareza-por-nivel: 0.04    # cuanto mas nivel, mas probabilidad de peces raros

# Probabilidad (0.0 - 1.0) de dejar el loot normal de Minecraft (tesoros, basura, peces vanilla)
loot-vanilla-chance: 0.0

frescura:
  aviso-porcentaje: 25     # avisa cuando queda este % de vida util
  refresco-segundos: 30    # cada cuanto se actualiza el estado de los peces en inventarios

# Orden = de comun a legendario (el orden afecta la probabilidad al subir de nivel)
rarezas:
  "Común": "&7"
  "Poco común": "&a"
  "Raro": "&9"
  "Épico": "&5"
  "Legendario": "&6"

