# ======================================================================
#  PescaPlus 2.0  -  Simulador de pesca
# ======================================================================
autoguardado-minutos: 5

nivel:
  maximo: 50
  xp-base: 100                    # XP para pasar de nivel L = xp-base * L^exponente
  exponente: 1.5
  bonus-venta-por-nivel: 0.01     # +1% de precio por nivel
  bonus-rareza-por-nivel: 0.04    # mas nivel = mas probabilidad de peces raros

loot-vanilla-chance: 0.0          # probabilidad de dejar el loot normal de Minecraft

anuncios:
  rank-minimo: 3                  # desde que rareza (0=Comun ... 4=Legendario) se anuncia al servidor

# Minijuego de tension: al picar un pez aparece una barra en la action bar.
# Hay que recoger la caña cuando el cursor esta dentro de la zona verde.
minijuego:
  ancho: 27
  zona-base: 9                    # tamaño de la zona (peces comunes). Baja 1 por rareza
  velocidad-base: 10.0            # celdas por segundo
  velocidad-por-rareza: 2.5

espera:                           # ticks que tarda en picar (vanilla 100-600)
  minimo: 100
  maximo: 600
  lluvia-factor: 0.8              # con lluvia pican antes

frescura:
  aviso-porcentaje: 25
  refresco-segundos: 30

rarezas:                          # orden = de comun a legendario
  "Común": "&7"
  "Poco común": "&a"
  "Raro": "&9"
  "Épico": "&5"
  "Legendario": "&6"

# zonas posibles: OCEANO, OCEANO_PROFUNDO, RIO, PANTANO, FRIO, JUNGLA, OTRO
