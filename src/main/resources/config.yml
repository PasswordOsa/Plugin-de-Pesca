# Mercado dinamico: vender muchos peces de la misma especie baja su precio.
mercado:
  saturacion-por-pez: 0.012
  recuperacion-por-minuto: 0.01
  minimo: 0.5
  tendencia-bonus: 1.3
  tendencia-minutos: 60

# Misiones diarias (se eligen 3 al dia). tipo: cualquiera | rareza | especie | perfecta
misiones:
  por-dia: 3
  pool:
    pescar-10:
      desc: "Pesca 10 peces"
      tipo: cualquiera
      cantidad: 10
      dinero: 150
      xp: 40
    pescar-25:
      desc: "Pesca 25 peces"
      tipo: cualquiera
      cantidad: 25
      dinero: 400
      xp: 100
    perfectas-3:
      desc: "Logra 3 capturas perfectas"
      tipo: perfecta
      cantidad: 3
      dinero: 300
      xp: 80
    poco-comun-5:
      desc: "Pesca 5 peces Poco comunes"
      tipo: rareza
      parametro: "Poco común"
      cantidad: 5
      dinero: 350
      xp: 90
    raro-2:
      desc: "Pesca 2 peces Raros"
      tipo: rareza
      parametro: "Raro"
      cantidad: 2
      dinero: 600
      xp: 150
    carpas-6:
      desc: "Pesca 6 Carpas"
      tipo: especie
      parametro: carpa
      cantidad: 6
      dinero: 200
      xp: 50

torneo:
  duracion-minutos: 10
  automatico-cada-minutos: 0      # 0 = desactivado. Ej: 60 = un torneo cada hora
  premios: [1500, 800, 400]       # dinero para 1º, 2º y 3º (solo a quienes esten conectados)

heladera:
  receta: true

