name: PescaPlus
version: 2.0.0
main: me.pesca.fishing.PescaPlugin
api-version: '1.21'
description: Simulador de pesca - minijuego, zonas, clima, mercado, misiones y torneos.
softdepend: [Vault]
commands:
  pesca:
    description: Menú y comandos de pesca
    aliases: [pescar, fishing]
    usage: /pesca
permissions:
  pesca.use:
    description: Permite pescar y usar los comandos
    default: true
  pesca.admin:
    description: Recargar, torneos, dar items
    default: op
