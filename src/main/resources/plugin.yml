name: PescaPlus
version: 1.0.0
main: me.pesca.fishing.PescaPlugin
api-version: '1.21'
description: Pesca con colección, niveles, venta y peces que se dañan sin heladera.
softdepend: [Vault]
commands:
  pesca:
    description: Comandos de pesca
    aliases: [pescar, fishing]
    usage: /pesca <info|coleccion|vender|limpiar>
permissions:
  pesca.use:
    description: Permite pescar y usar los comandos
    default: true
  pesca.admin:
    description: Recargar, dar heladeras
    default: op
